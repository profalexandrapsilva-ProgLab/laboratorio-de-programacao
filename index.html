function options(select,labels){select.replaceChildren(...labels.map((v,i)=>new Option(v,i)))}

function start(){stage=0;answers={};ran=false;render()}
function render(){task=data[+el('unit').value][1][+el('challenge').value];hints=0;el('hint').disabled=false;el('solution').disabled=true;el('feedback').textContent='';el('help').textContent='';el('heading').textContent=task.title+' · '+phases[stage];el('code').textContent=task.code;el('stages').replaceChildren(...phases.map((v,i)=>{let b=document.createElement('button');b.textContent=v;b.setAttribute('aria-current',String(i===stage));b.onclick=()=>{stage=i;render()};return b}));let y=Math.min(30,task.x+1);el('prompt').textContent=['Prevê a saída para '+task.label+' = '+task.x+'.','Executa a simulação com a entrada original. Compara a saída com a tua previsão. Depois experimenta outro inteiro entre 0 e 30.','Indica a saída para a entrada 0 e explica no teu caderno o papel de «'+task.concept+'».','Altera a entrada de '+task.x+' para '+y+'. Prevê o efeito desta alteração antes de a simulares na etapa Executar.','Cria uma nova solução para '+task.challenge+'. Escreve '+(+el('unit').value===0?'o pseudocódigo':'o código C++')+' e testa-o com as entradas '+task.tests.map(t=>t[0]).join(', ')+'.'][stage];el('work').innerHTML=stage===4?'<label>A tua solução<textarea id="a" rows="7"></textarea></label><button id="action">Comparar com os testes</button>':('<label>'+(stage===1?'Entrada da simulação':'A tua previsão')+' <input id="a" type="number" step="any"></label><button id="action">'+(stage===1?'Executar simulação':'Verificar')+'</button>');el('a').value=answers[stage]??(stage===1?task.x:'');el('a').oninput=()=>answers[stage]=el('a').value;el('action').onclick=()=>{let raw=el('a').value.trim(),n=Number(raw);if(!raw){el('feedback').textContent='Regista primeiro a tua resposta.';return}if(stage===1){el('feedback').textContent=Number.isInteger(n)&&n>=0&&n<=30?'Saída: '+task.run[n]+(answers[0]&&n===task.x?' · A tua previsão: '+answers[0]:''):'Usa um inteiro de 0 a 30.'}else if(stage===4){el('feedback').textContent='Resultados esperados (entrada → saída): '+task.tests.map(([a,b])=>a+' → '+Number(b.toFixed(4))).join(' | ')+'. Compara com a tua execução. A verificação do teu programa é manual.'}else{el('feedback').textContent=n===task.run[[task.x,task.x,0,y][stage]]?'Correto.':'Revê a execução linha a linha e tenta novamente.'}};el('next').textContent=stage===4?'Próximo desafio':'Próxima etapa'}
